# Comment for commit testing
name: Central Pipeline Validator
on:
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_NAME: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  ai-pipeline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Install Python dependencies
          run: pip install groq requests python-dotenv pyyaml

        - name: Run AI pipeline audit
          run: python ai_pipeline_reviewer.py

        - name: Auto-merge PR
          if: success()
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: gh pr merge ${{ github.event.pull_request.number }} --squash || echo "Merge failed, either due to a transient API issue or because the other pipeline already merged it."
